name: Apply QuickJS bindings migration

on:
  push:
    branches: [feature/quickjs-bindings]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev libudev-dev

      - name: Apply QuickJS bindings
        run: |
          python3 tools/apply_quickjs_bindings.py
          git submodule add https://github.com/bellard/quickjs vendor/quickjs
          git -C vendor/quickjs checkout 04be246001599f5995fa2f2d8c91a0f198d3f34c

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j2

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- CMakeLists.txt .gitmodules README.md vendor/quickjs include/quartz/client/runtime/RuntimeTypes.hpp include/quartz/client/runtime/RuntimeBindingEngine.hpp include/quartz/client/runtime/QuickJS.hpp src/runtime/Runtime.cpp src/runtime/QuickJS.cpp src/ui/RuntimeUI.cpp src/ui/pages/BindingsPage.cpp
          git commit -m "feat: add QuickJS scripted bindings"
          git push origin HEAD:feature/quickjs-bindings
