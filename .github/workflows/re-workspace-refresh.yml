name: Reverse engineering workspace refresh

on:
  push:
    branches: [feature/quickjs-bindings]
    paths:
      - tools/apply_re_workspace_refresh.py
      - tools/re-workspace-trigger.txt

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Apply reverse engineering refresh
        run: python3 tools/apply_re_workspace_refresh.py
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev libudev-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cmake --build build -j2 2>&1 | tee /tmp/quartz-build.log
      - name: Persist build diagnostics
        if: steps.build.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tail -n 260 /tmp/quartz-build.log > tools/re-build-error.log
          git add tools/re-build-error.log
          git commit -m "ci: capture reverse engineering build failure"
          git push
          exit 1
      - name: Commit validated reverse engineering refresh
        if: steps.build.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/SignatureMaker.cpp src/ui/MemoryInspector.cpp src/ui/pages/MemoryScannerPage.cpp src/ui/pages/MemoryWatchPage.cpp src/ui/ReverseEngineeringTools.cpp src/ui/I18n.cpp
          if git diff --cached --quiet; then
            echo "No product changes"
            exit 0
          fi
          git commit -m "refactor: connect reverse engineering workflows"
          git push
