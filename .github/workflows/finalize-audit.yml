name: Final audit

on:
  push:
    branches: ['finalize/**']

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Apply final bug and i18n audit
        run: python3 .github/scripts/finalize_audit.py

      - name: Remove one-shot audit and commit
        run: |
          git rm .github/workflows/finalize-audit.yml .github/scripts/finalize_audit.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/native/MemoryScanner.cpp src/ui/pages/MemoryScannerPage.cpp src/ui/pages/MemoryWatchPage.cpp src/ui/MemoryInspector.cpp src/ui/I18nReverseEngineering.cpp
          git commit -m 'fix: final x86 and i18n audit'
          git push origin HEAD:master
