name: TypeScript SDK cleanup

on:
  push:
    branches: [feature/quickjs-bindings]
    paths: [tools/apply_ts_sdk_cleanup.py]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Apply TypeScript SDK cleanup
        run: python3 tools/apply_ts_sdk_cleanup.py
      - name: Reject legacy script bridge leftovers
        run: |
          if grep -R -nE 'LegacyBridge|q\.legacy|runtimeInstallQuickJSGraphApi|QuickJSGraphApi' src/runtime include/quartz/client/runtime src/ui/pages/JavaScriptPage.cpp; then
            echo "Legacy scripting bridge leftovers found"
            exit 1
          fi
          test "$(grep -R -l 'runtimeQuickJSTypeDeclarations()' src/runtime | wc -l)" -eq 1
          grep -q 'declare module "@quartz/client"' src/runtime/QuickJSTypes.cpp
          ! grep -q 'declare const q' src/runtime/QuickJSTypes.cpp
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev libudev-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build -j2
      - name: Commit validated product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src include
          if git diff --cached --quiet; then
            echo "No product changes"
            exit 0
          fi
          git commit -m "feat: prepare TypeScript scripting SDK"
          git push
