name: Split Main.cpp safely

on:
  push:
    branches:
      - refactor/split-main

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/split-main
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev

      - name: Split Main.cpp without changing translation-unit semantics
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("src/Main.cpp")
          source = path.read_text()
          marker = "namespace\n{\n"
          namespace_at = source.find(marker)
          if namespace_at < 0:
              raise SystemExit("anonymous namespace marker not found")
          open_brace = namespace_at + len("namespace\n")
          body_start = open_brace + 2

          def raw_prefix_at(text, i):
              for prefix in ('R"', 'u8R"', 'uR"', 'UR"', 'LR"'):
                  if text.startswith(prefix, i):
                      return prefix
              return None

          def matching_brace(text, opening):
              depth = 0
              i = opening
              state = "normal"
              raw_end = None
              while i < len(text):
                  c = text[i]
                  n = text[i + 1] if i + 1 < len(text) else ""
                  if state == "line":
                      if c == "\n": state = "normal"
                      i += 1
                      continue
                  if state == "block":
                      if c == "*" and n == "/": state = "normal"; i += 2
                      else: i += 1
                      continue
                  if state == "string":
                      if c == "\\": i += 2
                      elif c == '"': state = "normal"; i += 1
                      else: i += 1
                      continue
                  if state == "char":
                      if c == "\\": i += 2
                      elif c == "'": state = "normal"; i += 1
                      else: i += 1
                      continue
                  if state == "raw":
                      end = text.find(raw_end, i)
                      if end < 0: raise SystemExit("unterminated raw string")
                      i = end + len(raw_end)
                      state = "normal"
                      continue
                  if c == "/" and n == "/": state = "line"; i += 2; continue
                  if c == "/" and n == "*": state = "block"; i += 2; continue
                  prefix = raw_prefix_at(text, i)
                  if prefix:
                      delimiter_start = i + len(prefix)
                      paren = text.find("(", delimiter_start)
                      if paren < 0: raise SystemExit("invalid raw string")
                      delimiter = text[delimiter_start:paren]
                      raw_end = ")" + delimiter + '"'
                      state = "raw"
                      i = paren + 1
                      continue
                  if c == '"': state = "string"; i += 1; continue
                  if c == "'": state = "char"; i += 1; continue
                  if c == "{": depth += 1
                  elif c == "}":
                      depth -= 1
                      if depth == 0: return i
                  i += 1
              raise SystemExit("anonymous namespace closing brace not found")

          namespace_close = matching_brace(source, open_brace)
          body = source[body_start:namespace_close]
          suffix = source[namespace_close + 1:]

          # Find safe top-level line boundaries. Includes will preserve one-TU semantics,
          # so we only need to avoid splitting preprocessing tokens/literals/declarations.
          boundaries = [0]
          depth = paren = bracket = 0
          state = "normal"
          raw_end = None
          line_start = 0
          preprocessor_continued = False
          i = 0
          candidates = []
          while i < len(body):
              c = body[i]
              n = body[i + 1] if i + 1 < len(body) else ""
              if state == "line":
                  if c == "\n": state = "normal"
                  i += 1
                  continue
              if state == "block":
                  if c == "*" and n == "/": state = "normal"; i += 2
                  else: i += 1
                  continue
              if state == "string":
                  if c == "\\": i += 2
                  elif c == '"': state = "normal"; i += 1
                  else: i += 1
                  continue
              if state == "char":
                  if c == "\\": i += 2
                  elif c == "'": state = "normal"; i += 1
                  else: i += 1
                  continue
              if state == "raw":
                  end = body.find(raw_end, i)
                  if end < 0: raise SystemExit("unterminated raw string in namespace body")
                  i = end + len(raw_end)
                  state = "normal"
                  continue
              if c == "/" and n == "/": state = "line"; i += 2; continue
              if c == "/" and n == "*": state = "block"; i += 2; continue
              prefix = raw_prefix_at(body, i)
              if prefix:
                  delimiter_start = i + len(prefix)
                  raw_paren = body.find("(", delimiter_start)
                  delimiter = body[delimiter_start:raw_paren]
                  raw_end = ")" + delimiter + '"'
                  state = "raw"
                  i = raw_paren + 1
                  continue
              if c == '"': state = "string"; i += 1; continue
              if c == "'": state = "char"; i += 1; continue
              if c == "{": depth += 1
              elif c == "}": depth -= 1
              elif c == "(": paren += 1
              elif c == ")": paren -= 1
              elif c == "[": bracket += 1
              elif c == "]": bracket -= 1
              if c == "\n":
                  line = body[line_start:i].rstrip()
                  if depth == 0 and paren == 0 and bracket == 0 and not preprocessor_continued:
                      if line.endswith(";") or line.endswith("}") or line.startswith("#endif"):
                          candidates.append(i + 1)
                  preprocessor_continued = line.endswith("\\")
                  line_start = i + 1
              i += 1

          target = 42000
          last = 0
          while last + target < len(body):
              desired = last + target
              after = next((p for p in candidates if p >= desired and p - last <= target * 2), None)
              if after is None:
                  before = [p for p in candidates if p > last and p < desired]
                  after = before[-1] if before else None
              if after is None or after <= last: raise SystemExit(f"no safe split boundary after byte {last}")
              boundaries.append(after)
              last = after
          boundaries.append(len(body))
          chunks = [body[a:b] for a, b in zip(boundaries, boundaries[1:]) if b > a]
          if ''.join(chunks) != body: raise SystemExit("split did not round-trip body")

          keywords = [
              ("ShaderSources", ("FragmentShaderSource", "DefaultVertexShaderSource")),
              ("USB", ("class RawUSB", "struct USB")),
              ("Audio", ("class AudioSpectrum", "AudioLevelSnapshot")),
              ("Media", ("class MediaColorProvider", "MPRIS")),
              ("Input", ("class EvdevKeyboard", "ReactiveKeyState")),
              ("ShaderRuntime", ("class ShaderFramebuffer", "ShaderTransitionState")),
              ("RuntimeNative", ("RuntimeRegisterCaptureState", "process_vm_readv", "ptrace")),
              ("RuntimeModel", ("RuntimeObject", "RuntimePointer", "ObjectField")),
              ("RuntimeBindings", ("class RuntimeBindingEngine", "RuntimeSourceKind")),
              ("RuntimeControls", ("RuntimeControl", "RuntimeAction")),
              ("RuntimeUI", ("drawRuntimeBindingsPage", "RE / Bindings")),
              ("UI", ("drawUi(", "ImGui::BeginTabItem")),
          ]
          used = {}
          out_dir = Path("src/main")
          out_dir.mkdir(parents=True, exist_ok=True)
          for old in out_dir.glob("Main*.inc"): old.unlink()
          names = []
          for index, chunk in enumerate(chunks, 1):
              label = "Core"
              best = 0
              for candidate, needles in keywords:
                  score = sum(chunk.count(needle) for needle in needles)
                  if score > best:
                      best = score
                      label = candidate
              used[label] = used.get(label, 0) + 1
              suffix_name = f"{used[label]:02d}" if used[label] > 1 else ""
              name = f"Main{label}{suffix_name}.inc"
              while name in names:
                  used[label] += 1
                  name = f"Main{label}{used[label]:02d}.inc"
              names.append(name)
              (out_dir / name).write_text(chunk)

          # Keep implementation macros/includes in Main.cpp, preserve the anonymous namespace,
          # and textually include every extracted body fragment in the exact original order.
          prefix = source[:body_start]
          include_block = ''.join(f'#include "main/{name}"\n' for name in names)
          entry_name = "MainEntry.inc"
          (out_dir / entry_name).write_text(suffix.lstrip("\n"))
          rewritten = prefix + include_block + "}\n\n" + f'#include "main/{entry_name}"\n'
          path.write_text(rewritten)

          # The most fragile historical lifetime invariant must remain textually unchanged.
          original_capture = re.search(r'(?:struct|class)\s+RuntimeRegisterCaptureState\b', body)
          if not original_capture: raise SystemExit("RuntimeRegisterCaptureState not found")
          capture_tail = body[original_capture.start():original_capture.start() + 20000]
          worker = capture_tail.find("std::jthread Worker")
          status = capture_tail.find("Status")
          if worker < 0 or status < 0 or worker < status:
              raise SystemExit("RuntimeRegisterCaptureState Worker lifetime invariant not found")

          manifest = [
              "# Main.cpp structural split\n",
              "These `.inc` files intentionally remain one translation unit. This first containment refactor preserves anonymous-namespace linkage, declaration order, static initialization, and destruction order while making the 700+ KiB `Main.cpp` navigable.\n",
              "The fragments are generated from the original body at safe top-level boundaries and are included in their original order. `MainEntry.inc` contains the program entry point outside the anonymous namespace.\n",
              "## Include order\n",
          ]
          manifest += [f"{i}. `{name}` ({len(chunk)} bytes)\n" for i, (name, chunk) in enumerate(zip(names, chunks), 1)]
          manifest += [f"{len(names) + 1}. `{entry_name}` ({len(suffix.lstrip(chr(10)))} bytes)\n"]
          (out_dir / "README.md").write_text("\n".join(manifest))
          print(f"Split {len(body)} namespace-body bytes into {len(chunks)} fragments; entry {len(suffix)} bytes")
          print("\n".join(names))

      - name: Structural sanity checks
        run: |
          git diff --check
          test $(wc -l < src/Main.cpp) -lt 160
          grep -R -q "std::jthread Worker" src/main
          grep -R -q "RuntimeRegisterCaptureState" src/main
          grep -q 'main/MainEntry.inc' src/Main.cpp

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j2

      - name: Commit validated split
        run: |
          rm .github/workflows/refactor-split-main.yml
          git config user.name "Quartz refactor bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/Main.cpp src/main .github/workflows/refactor-split-main.yml
          git commit -m "refactor: split Main.cpp into structural modules"
          git push origin HEAD:refactor/split-main
