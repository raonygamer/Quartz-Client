name: Architecture refactor

on:
  push:
    branches: [refactor/split-main]

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/split-main
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev libudev-dev

      - name: Generate architecture split
        run: |
          python tools/architecture_refactor.py
          python tools/fix_architecture_output.py
          python tools/page_refactor.py
          python tools/fix_page_output.py
          python tools/usb_refactor.py
          python tools/semantic_headers.py

      - name: Structural checks
        run: |
          git diff --check
          test $(wc -l < src/Main.cpp) -lt 20
          grep -q 'class Application' include/quartz/client/Application.hpp
          grep -q 'class PageManager' include/quartz/client/ui/PageManager.hpp
          grep -q 'virtual void render' include/quartz/client/ui/Page.hpp
          grep -q 'class USBTransport' include/quartz/client/usb/USBTransport.hpp
          grep -q 'class QRPCSession' include/quartz/client/usb/QRPCSession.hpp
          grep -q 'class RawUSB' include/quartz/client/usb/RawUSB.hpp
          grep -q 'struct RuntimeBindingProfile' include/quartz/client/runtime/Profile.hpp
          grep -q 'struct RuntimeRegisterCaptureState' include/quartz/client/native/NativeTypes.hpp
          grep -q 'class RuntimeBindingEngine' include/quartz/client/runtime/RuntimeBindingEngine.hpp
          grep -q 'class ShaderFramebuffer' include/quartz/client/shader/ShaderFramebuffer.hpp
          test -f src/usb/USBTransport.cpp
          test -f src/runtime/RuntimeNative.cpp
          test -f src/ui/PageManager.cpp
          test -f src/ui/pages/VisualizerPage.cpp

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j2

      - name: Commit validated architecture split
        run: |
          git config user.name 'quartz-refactor-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'refactor: split client model into subsystem headers'
          git push origin HEAD:refactor/split-main
