name: Finish JavaScript runtime

on:
  push:
    branches: [feature/quickjs-bindings]

permissions:
  contents: write

jobs:
  migrate-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev libudev-dev

      - name: Apply runtime integration
        run: python3 .github/scripts/finish_javascript_runtime.py

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cmake --build build -j2 2>&1 | tee /tmp/quartz-build.log

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: javascript-runtime-build-log
          path: /tmp/quartz-build.log
          if-no-files-found: ignore

      - name: Require successful build
        if: steps.build.outcome != 'success'
        run: exit 1

      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add include src
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git commit -m "refactor: make JavaScript the first-class runtime"
          git push
