name: Navigation and scripts cleanup

on:
  push:
    branches: [feature/quickjs-bindings]
    paths: [tools/apply_nav_scripts_cleanup.py]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Apply cleanup
        run: python3 tools/apply_nav_scripts_cleanup.py
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev libudev-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build -j2
      - name: Commit validated cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/PageManager.cpp src/ui/pages/JavaScriptPage.cpp
          if git diff --cached --quiet; then
            echo "No product changes"
            exit 0
          fi
          git commit -m "style: inset navigation labels and remove runtime api panel"
          git push
