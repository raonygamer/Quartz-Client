name: Validate Main split v3

on:
  push:
    branches: [refactor/split-main]

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/split-main
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev libudev-dev

      - name: Split Main.cpp
        run: python tools/split_main.py

      - name: Structural sanity checks
        run: |
          git diff --check
          test $(wc -l < src/Main.cpp) -lt 180
          grep -R -q 'RuntimeRegisterCaptureState' src/main
          grep -R -q 'std::jthread Worker' src/main
          grep -q 'main/MainEntry.inc' src/Main.cpp

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j2

      - name: Commit validated split
        run: |
          rm -f .github/workflows/refactor-split-main-v3.yml .github/refactor-trigger tools/split_main.py
          git config user.name 'Quartz refactor bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: split Main.cpp into structural modules'
          git push origin HEAD:refactor/split-main
