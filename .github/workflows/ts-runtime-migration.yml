name: Executable TypeScript runtime

on:
  push:
    branches: [feature/quickjs-bindings]
    paths:
      - tools/apply_ts_runtime_fixup.py
      - .github/workflows/ts-runtime-migration.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Apply correctness fixups
        run: python3 tools/apply_ts_runtime_fixup.py
      - name: Validate runtime architecture
        run: |
          ! grep -n 'function(q)' src/runtime/QuickJSWorkspace.cpp
          ! grep -n 'q.import' src/runtime/QuickJSWorkspace.cpp
          ! grep -n 'instance->Function' src/runtime/QuickJSWorkspace.cpp
          grep -q 'JS_EVAL_TYPE_MODULE' src/runtime/QuickJSWorkspace.cpp
          grep -q 'JS_ExecutePendingJob' src/runtime/QuickJSWorkspace.cpp
          grep -q '@quartz/client' src/runtime/QuickJSWorkspace.cpp
          grep -q '@quartz/native' src/runtime/QuickJSSDK.cpp
          grep -q 'readonly \$address: Address' src/runtime/QuickJSTypes.cpp
      - name: Terraria-shaped TypeScript smoke test
        run: |
          cat >/tmp/ts-strip.cpp <<'CPP'
          #include "QuickJSInternal.hpp"
          #include <fstream>
          #include <iostream>
          using namespace quartz::client;
          int main() {
              const char* ts = R"TS(import { Breakpoint, Field, Process, Property, Runtime, Script, Signature, Struct, System } from "@quartz/client";
          import type { Pointer } from "@quartz/client";
          const WorldReference = Struct.define({ address: Field.UInt32(0x11n) });
          const Player = Struct.define({
              statLifeMax2: Field.Int32(0x814n),
              statLife: Field.Int32(0x81Cn)
          });
          let process: Process | undefined;
          let player: Pointer<typeof Player> | undefined;
          let capture: Breakpoint | undefined;
          async function resolveSession(target: Process): Promise<void> {
              const [worldSite, playerSite] = await Promise.all([Signature.scan(target, "AA"), Signature.scan(target, "BB")]);
              const worldAddress = BigInt(WorldReference.at(target, worldSite).address);
              console.log(worldAddress, playerSite);
          }
          function update({ time }: { time: number; deltaTime: number }): void {
              if (player) Runtime.setMaterial("source.health", 0, Math.max(0, player.statLife / player.statLifeMax2));
              if (capture) console.log(time);
          }
          System.on("update", update);
          )TS";
              std::string js, error;
              if (!runtimeTranspileTypeScript(ts, js, error)) { std::cerr << error << '\n'; return 1; }
              if (js.find("import type") != std::string::npos || js.find(": Process") != std::string::npos || js.find(": Pointer") != std::string::npos || js.find(": Breakpoint") != std::string::npos || js.find(": Promise") != std::string::npos || js.find(": { time") != std::string::npos) return 2;
              if (js.find("statLifeMax2: Field.Int32") == std::string::npos || js.find("statLife: Field.Int32") == std::string::npos || js.find("address: Field.UInt32") == std::string::npos) return 3;
              std::ofstream("/tmp/ts-strip.mjs") << js;
          }
          CPP
          g++ -std=c++20 -Isrc/runtime -Iinclude -Ivendor/quickjs /tmp/ts-strip.cpp src/runtime/QuickJSSDK.cpp -o /tmp/ts-strip
          /tmp/ts-strip
          node --check /tmp/ts-strip.mjs
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev libudev-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build -j2
      - name: Commit validated product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src include
          if git diff --cached --quiet; then
            echo "No product changes"
            exit 0
          fi
          git commit -m "fix: harden TypeScript scripting runtime"
          git push
