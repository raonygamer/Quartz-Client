name: Finalize JavaScript workspace

on:
  push:
    branches: [feature/quickjs-bindings]
    paths:
      - .github/workflows/javascript-workspace-migration.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev libudev-dev

      - name: Respect hot reload controls and finish hotkey UI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/runtime/QuickJSWorkspace.cpp')
          text = path.read_text()
          old = 'auto&w=workspace();auto existing=w.Instances.find(script.Id);if(existing!=w.Instances.end()&&engine.scriptSettings().ExternalHotReload&&script.HotReload&&dependenciesChanged(*existing->second)){w.Instances.erase(existing);++script.ReloadCount;}'
          new = 'auto&w=workspace();const bool watchExternal=engine.scriptSettings().ExternalHotReload&&script.HotReload;auto existing=w.Instances.find(script.Id);if(existing!=w.Instances.end()&&watchExternal&&dependenciesChanged(*existing->second)){w.Instances.erase(existing);++script.ReloadCount;}'
          if text.count(old) != 1:
              raise RuntimeError(f'hot reload guard: expected one match, got {text.count(old)}')
          text = text.replace(old, new, 1)

          old = 'std::string source;std::filesystem::path filename;if(script.External){filename=script.Path;if(filename.is_relative())filename=runtimeQuickJSScriptDirectory()/filename;if(!loadFile(filename,source)){script.Status="could not read external script: "+filename.string();return false;}}else source=script.Source;'
          new = 'bool reuseExternal=false;std::string source;std::filesystem::path filename;if(script.External){filename=script.Path;if(filename.is_relative())filename=runtimeQuickJSScriptDirectory()/filename;existing=w.Instances.find(script.Id);reuseExternal=existing!=w.Instances.end()&&!watchExternal&&JS_IsFunction(existing->second->Context,existing->second->Function);if(!reuseExternal&&!loadFile(filename,source)){script.Status="could not read external script: "+filename.string();return false;}}else source=script.Source;'
          if text.count(old) != 1:
              raise RuntimeError(f'external reuse path: expected one match, got {text.count(old)}')
          text = text.replace(old, new, 1)

          old = 'std::string error;if(!compile(*instance,script,source,filename,error)){script.Status=std::move(error);return false;}'
          new = 'std::string error;if(!reuseExternal&&!compile(*instance,script,source,filename,error)){script.Status=std::move(error);return false;}'
          if text.count(old) != 1:
              raise RuntimeError(f'external compile guard: expected one match, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1))

          path = Path('src/ui/pages/JavaScriptPage.cpp')
          text = path.read_text()
          old = '{"V",GLFW_KEY_V},{"W",GLFW_KEY_W},{"X",GLFW_KEY_X},{"Y",GLFW_KEY_Y},{"Z",GLFW_KEY_Z}};'
          new = '{"V",GLFW_KEY_V},{"W",GLFW_KEY_W},{"X",GLFW_KEY_X},{"Y",GLFW_KEY_Y},{"Z",GLFW_KEY_Z},{"0",GLFW_KEY_0},{"1",GLFW_KEY_1},{"2",GLFW_KEY_2},{"3",GLFW_KEY_3},{"4",GLFW_KEY_4},{"5",GLFW_KEY_5},{"6",GLFW_KEY_6},{"7",GLFW_KEY_7},{"8",GLFW_KEY_8},{"9",GLFW_KEY_9}};'
          if text.count(old) != 1:
              raise RuntimeError(f'reload hotkey digits: expected one match, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j2

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/QuickJSWorkspace.cpp src/ui/pages/JavaScriptPage.cpp
          git commit -m "fix: respect JavaScript hot reload controls"
          git push
