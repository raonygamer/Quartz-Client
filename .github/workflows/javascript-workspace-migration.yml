name: Apply JavaScript workspace migration

on:
  push:
    branches: [feature/quickjs-bindings]
    paths:
      - tools/apply_javascript_workspace.py
      - .github/workflows/javascript-workspace-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev libudev-dev

      - name: Fix staging typo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_javascript_workspace.py')
          lines = path.read_text().splitlines(keepends=True)
          for index, line in enumerate(lines):
              if 'runtimeInstallTerrariaAstrofluxMigration' not in line or 'replace_once' not in line:
                  continue
              assert line.rstrip().endswith(')')
              newline = '\n' if line.endswith('\n') else ''
              lines[index] = line.rstrip('\n')[:-1] + ', "quickjs workspace public api")' + newline
              break
          else:
              raise RuntimeError('staging typo target not found')
          path.write_text(''.join(lines))
          PY

      - name: Apply JavaScript workspace migration
        run: python3 tools/apply_javascript_workspace.py

      - name: Adapt editor change detection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/ui/pages/JavaScriptPage.cpp')
          text = path.read_text()
          old = 'if(e.Editor.IsTextChanged()){script.Source=e.Editor.GetText();'
          new = 'const std::string edited=e.Editor.GetText();if(edited!=e.Synced){script.Source=edited;'
          if text.count(old) != 1:
              raise RuntimeError(f'expected one editor change-detection site, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j2

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md include/quartz/client/runtime/Profile.hpp include/quartz/client/runtime/RuntimeTypes.hpp include/quartz/client/runtime/QuickJS.hpp include/quartz/client/runtime/RuntimeBindingEngine.hpp include/quartz/client/ui/pages/JavaScriptPage.hpp src/runtime/QuickJSInternal.hpp src/runtime/QuickJSApi.cpp src/runtime/QuickJSGraphApi.cpp src/runtime/QuickJSWorkspace.cpp src/runtime/QuickJSPresets.cpp src/ui/pages/JavaScriptPage.cpp src/ui/PageManager.cpp src/ui/RuntimeUI.cpp src/Application.cpp
          git commit -m "feat: add first-class JavaScript runtime workspace"
          git push
