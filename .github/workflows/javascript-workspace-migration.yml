name: Finalize JavaScript workspace

on:
  push:
    branches: [feature/quickjs-bindings]
    paths:
      - .github/workflows/javascript-workspace-migration.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev libudev-dev

      - name: Harden imports and external reload polling
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/runtime/QuickJSWorkspace.cpp')
          text = path.read_text()

          old = 'JSContext* Context=nullptr;JSValue Function=JS_UNDEFINED,Api=JS_UNDEFINED;std::uint64_t SourceHash=0;std::filesystem::path MainPath,CurrentDirectory;std::unordered_map<std::string,std::filesystem::file_time_type> DependencyTimes;'
          new = 'JSContext* Context=nullptr;JSValue Function=JS_UNDEFINED,Api=JS_UNDEFINED;std::uint64_t SourceHash=0;std::filesystem::path MainPath,CurrentDirectory;std::filesystem::file_time_type MainTime{};std::unordered_map<std::string,std::filesystem::file_time_type> DependencyTimes;'
          if text.count(old) != 1:
              raise RuntimeError(f'main timestamp member: expected one match, got {text.count(old)}')
          text = text.replace(old, new, 1)

          old = 'std::string wrapped="(function(q,exports,module){\\n\\\"use strict\\\";\\n"+source+"\\n;return module.exports;\\n})";auto&w=workspace();w.begin(instance->Script?instance->Script->TimeoutMs:4.0f);JSValue fn=JS_Eval(ctx,wrapped.c_str(),wrapped.size(),key.c_str(),JS_EVAL_TYPE_GLOBAL|JS_EVAL_FLAG_STRICT);w.end();if(JS_IsException(fn))return fn;'
          new = 'std::string wrapped="(function(q,exports,module){\\n\\\"use strict\\\";\\n"+source+"\\n;return module.exports;\\n})";JSValue fn=JS_Eval(ctx,wrapped.c_str(),wrapped.size(),key.c_str(),JS_EVAL_TYPE_GLOBAL|JS_EVAL_FLAG_STRICT);if(JS_IsException(fn))return fn;'
          if text.count(old) != 1:
              raise RuntimeError(f'import compile deadline nesting: expected one match, got {text.count(old)}')
          text = text.replace(old, new, 1)

          old = 'const auto old=instance->CurrentDirectory;instance->CurrentDirectory=path.parent_path();w.begin(instance->Script?instance->Script->TimeoutMs:4.0f);JSValue result=JS_Call(ctx,fn,JS_UNDEFINED,3,args);w.end();instance->CurrentDirectory=old;'
          new = 'const auto old=instance->CurrentDirectory;instance->CurrentDirectory=path.parent_path();JSValue result=JS_Call(ctx,fn,JS_UNDEFINED,3,args);instance->CurrentDirectory=old;'
          if text.count(old) != 1:
              raise RuntimeError(f'import call deadline nesting: expected one match, got {text.count(old)}')
          text = text.replace(old, new, 1)

          old = 'instance.MainPath=filename;instance.CurrentDirectory=filename.empty()?runtimeQuickJSScriptDirectory():filename.parent_path();'
          new = 'instance.MainPath=filename;instance.MainTime=filename.empty()?std::filesystem::file_time_type::min():fileTime(filename);instance.CurrentDirectory=filename.empty()?runtimeQuickJSScriptDirectory():filename.parent_path();'
          if text.count(old) != 1:
              raise RuntimeError(f'main timestamp capture: expected one match, got {text.count(old)}')
          text = text.replace(old, new, 1)

          old = 'bool reuseExternal=false;std::string source;std::filesystem::path filename;if(script.External){filename=script.Path;if(filename.is_relative())filename=runtimeQuickJSScriptDirectory()/filename;existing=w.Instances.find(script.Id);reuseExternal=existing!=w.Instances.end()&&!watchExternal&&JS_IsFunction(existing->second->Context,existing->second->Function);if(!reuseExternal&&!loadFile(filename,source)){script.Status="could not read external script: "+filename.string();return false;}}else source=script.Source;'
          new = 'bool reuseExternal=false;std::string source;std::filesystem::path filename;if(script.External){filename=script.Path;if(filename.is_relative())filename=runtimeQuickJSScriptDirectory()/filename;existing=w.Instances.find(script.Id);if(existing!=w.Instances.end()&&watchExternal&&(existing->second->MainPath!=filename||existing->second->MainTime!=fileTime(filename))){w.Instances.erase(existing);++script.ReloadCount;existing=w.Instances.end();}reuseExternal=existing!=w.Instances.end()&&JS_IsFunction(existing->second->Context,existing->second->Function);if(!reuseExternal&&!loadFile(filename,source)){script.Status="could not read external script: "+filename.string();return false;}}else source=script.Source;'
          if text.count(old) != 1:
              raise RuntimeError(f'external mtime reuse: expected one match, got {text.count(old)}')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j2

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/QuickJSWorkspace.cpp
          git commit -m "fix: harden JavaScript hot reload lifecycle"
          git push
