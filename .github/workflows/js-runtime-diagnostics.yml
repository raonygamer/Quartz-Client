name: JavaScript runtime diagnostics migration

on:
  push:
    branches: [feature/quickjs-bindings]
    paths:
      - tools/apply_js_runtime_diagnostics.py
      - .github/workflows/js-runtime-diagnostics.yml

permissions:
  contents: write

jobs:
  migrate-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Apply JavaScript runtime diagnostics migration
        run: python3 tools/apply_js_runtime_diagnostics.py

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev libudev-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j2

      - name: Commit generated product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add include src
          if git diff --cached --quiet; then
            echo "No product changes generated"
            exit 1
          fi
          git commit -m "feat: add async JavaScript scans and runtime diagnostics"
          git push origin HEAD:feature/quickjs-bindings
